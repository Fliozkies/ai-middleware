<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Middleware — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f9f8f6;
      --surface: #ffffff;
      --border: #e8e4de;
      --border-soft: #f0ede8;
      --text: #1a1814;
      --text-muted: #8a8680;
      --text-light: #b8b4ae;
      --accent: #2a2420;
      --accent-warm: #c4622d;
      --accent-blue: #2d5ec4;
      --accent-green: #2dc47a;
      --accent-purple: #7c2dc4;
      --tag-bg: #f0ede8;
      --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
      --shadow-hover: 0 2px 8px rgba(0,0,0,0.10), 0 8px 32px rgba(0,0,0,0.06);
      --radius: 12px;
      --radius-sm: 8px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }

    /* ── CONFIG BAR ── */
    #config-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: var(--text);
      color: #f9f8f6;
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
    }
    #config-bar span { color: var(--text-light); }
    #config-bar input {
      flex: 1;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      padding: 5px 10px;
      color: #f9f8f6;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      outline: none;
    }
    #config-bar input:focus { border-color: rgba(255,255,255,0.3); }
    #config-bar input::placeholder { color: rgba(255,255,255,0.3); }
    #status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #555;
      transition: background 0.3s;
    }
    #status-dot.online { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
    #status-dot.error { background: var(--accent-warm); }
    #connect-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      color: #f9f8f6;
      padding: 5px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      transition: background 0.2s;
    }
    #connect-btn:hover { background: rgba(255,255,255,0.2); }

    /* ── LAYOUT ── */
    #app {
      padding-top: 44px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      padding: 40px 40px 0;
      display: flex;
      align-items: baseline;
      gap: 16px;
    }
    header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: -0.5px;
    }
    header h1 em {
      font-style: italic;
      color: var(--accent-warm);
    }
    header .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
    }

    /* ── KNOWLEDGE GRAPH ── */
    #graph-section {
      margin: 32px 40px 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    #graph-header {
      padding: 16px 20px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-soft);
    }
    #graph-header h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 15px;
      font-weight: 400;
    }
    #graph-header .graph-meta {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
    }
    #graph-canvas {
      width: 100%;
      height: 260px;
      display: block;
    }
    #graph-canvas.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-light);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
    }
    #graph-tooltip {
      position: fixed;
      background: var(--text);
      color: #f9f8f6;
      padding: 6px 10px;
      border-radius: 6px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      max-width: 240px;
      line-height: 1.4;
      z-index: 200;
    }

    /* ── TABS ── */
    #tabs-nav {
      display: flex;
      gap: 0;
      padding: 24px 40px 0;
      border-bottom: 1px solid var(--border);
      margin: 0 0 0;
    }
    .tab-btn {
      padding: 10px 20px;
      border: none;
      background: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active {
      color: var(--text);
      border-bottom-color: var(--accent);
      font-weight: 500;
    }
    .tab-count {
      background: var(--tag-bg);
      color: var(--text-muted);
      padding: 1px 6px;
      border-radius: 10px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
    }
    .tab-btn.active .tab-count {
      background: var(--accent);
      color: #f9f8f6;
    }

    /* ── TAB PANELS ── */
    .tab-panel { display: none; padding: 28px 40px 40px; }
    .tab-panel.active { display: block; }

    /* ── PANEL TOOLBAR ── */
    .panel-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .panel-toolbar h3 {
      font-family: 'DM Serif Display', serif;
      font-size: 18px;
      font-weight: 400;
    }
    .btn {
      padding: 7px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      color: var(--text);
    }
    .btn:hover { background: var(--tag-bg); border-color: var(--text-light); }
    .btn.primary {
      background: var(--accent);
      color: #f9f8f6;
      border-color: var(--accent);
    }
    .btn.primary:hover { background: #3a3430; }

    /* ── CARDS GRID ── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
      transition: box-shadow 0.2s, transform 0.2s;
      cursor: default;
    }
    .card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-1px);
    }
    .card-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .card-content {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
      margin-bottom: 12px;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tag {
      background: var(--tag-bg);
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 4px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
    }
    .tag.importance-3 { background: #fff3ee; color: var(--accent-warm); }
    .tag.importance-2 { background: #eef3ff; color: var(--accent-blue); }
    .tag.importance-1 { background: var(--tag-bg); color: var(--text-light); }
    .tag.cat-goal { background: #eefff6; color: var(--accent-green); }
    .tag.cat-preference { background: #eef3ff; color: var(--accent-blue); }
    .tag.cat-pattern { background: #f3eeff; color: var(--accent-purple); }
    .tag.cat-decision { background: #fff3ee; color: var(--accent-warm); }
    .tag.cat-context { background: var(--tag-bg); color: var(--text-muted); }
    .tag.cat-relationship { background: #fff0f0; color: #c42d2d; }

    .card-time {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--text-light);
      margin-left: auto;
    }

    /* ── CHECKPOINT CARD ── */
    .checkpoint-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 20px;
    }
    .checkpoint-card h4 {
      font-family: 'DM Serif Display', serif;
      font-size: 15px;
      font-weight: 400;
      margin-bottom: 10px;
    }
    .checkpoint-summary {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-soft);
    }
    .checkpoint-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
    }
    .checkpoint-col h5 {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .checkpoint-col ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .checkpoint-col ul li {
      font-size: 12px;
      color: var(--text);
      padding: 4px 8px;
      background: var(--tag-bg);
      border-radius: 4px;
      line-height: 1.4;
    }
    .next-step {
      margin-top: 16px;
      padding: 10px 14px;
      background: #fff8f4;
      border: 1px solid #fce8da;
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--accent-warm);
      font-family: 'DM Mono', monospace;
    }
    .next-step::before { content: '→ '; }

    /* ── PROJECTS ── */
    .project-card .project-name {
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .project-card .project-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .tech-tags { display: flex; gap: 4px; flex-wrap: wrap; }

    /* ── FILE TREE ── */
    .file-tree {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .file-tree-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-soft);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg);
    }
    .file-row {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border-soft);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
    }
    .file-row:last-child { border-bottom: none; }
    .file-row:hover { background: var(--bg); }
    .file-row .file-icon { color: var(--text-light); font-size: 11px; }
    .file-row .file-path { flex: 1; color: var(--text); }
    .file-row .file-ver {
      color: var(--text-light);
      font-size: 10px;
      background: var(--tag-bg);
      padding: 1px 6px;
      border-radius: 4px;
    }

    /* ── TOOLS ── */
    .tool-card .tool-name {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
    }
    .tool-card .tool-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .tool-trigger {
      font-size: 11px;
      color: var(--text-muted);
      font-style: italic;
      padding: 6px 10px;
      background: var(--bg);
      border-radius: 4px;
      margin-bottom: 10px;
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--text-light);
    }
    .empty-state .empty-icon { font-size: 32px; margin-bottom: 12px; }
    .empty-state p { font-size: 13px; }

    /* ── LOADING ── */
    .loading {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      padding: 24px 0;
    }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<!-- Config Bar -->
<div id="config-bar">
  <div id="status-dot"></div>
  <span>API</span>
  <input id="api-url" type="text" placeholder="https://ai-middleware.vercel.app" value="https://ai-middleware.vercel.app" />
  <span>Token</span>
  <input id="api-token" type="password" placeholder="Bearer token" />
  <button id="connect-btn" onclick="connect()">Connect</button>
</div>

<div id="app">
  <header>
    <h1>AI <em>Middleware</em></h1>
    <span class="subtitle">personal knowledge OS</span>
  </header>

  <!-- Knowledge Graph -->
  <div id="graph-section">
    <div id="graph-header">
      <h2>Knowledge Graph</h2>
      <span class="graph-meta" id="graph-meta">— connect to load</span>
    </div>
    <svg id="graph-canvas"></svg>
  </div>

  <!-- Tabs -->
  <div id="tabs-nav">
    <button class="tab-btn active" onclick="switchTab('memory')">
      Memory <span class="tab-count" id="count-memory">0</span>
    </button>
    <button class="tab-btn" onclick="switchTab('checkpoint')">
      Checkpoint <span class="tab-count" id="count-checkpoint">—</span>
    </button>
    <button class="tab-btn" onclick="switchTab('projects')">
      Projects <span class="tab-count" id="count-projects">0</span>
    </button>
    <button class="tab-btn" onclick="switchTab('tools')">
      Tools <span class="tab-count" id="count-tools">0</span>
    </button>
  </div>

  <!-- Memory Tab -->
  <div class="tab-panel active" id="panel-memory">
    <div class="panel-toolbar">
      <h3>Memory Facts</h3>
    </div>
    <div id="memory-content"><div class="empty-state"><div class="empty-icon">◌</div><p>Connect to load facts</p></div></div>
  </div>

  <!-- Checkpoint Tab -->
  <div class="tab-panel" id="panel-checkpoint">
    <div class="panel-toolbar">
      <h3>Latest Checkpoint</h3>
    </div>
    <div id="checkpoint-content"><div class="empty-state"><div class="empty-icon">◌</div><p>Connect to load checkpoint</p></div></div>
  </div>

  <!-- Projects Tab -->
  <div class="tab-panel" id="panel-projects">
    <div class="panel-toolbar">
      <h3>Projects</h3>
    </div>
    <div id="projects-content"><div class="empty-state"><div class="empty-icon">◌</div><p>Connect to load projects</p></div></div>
  </div>

  <!-- Tools Tab -->
  <div class="tab-panel" id="panel-tools">
    <div class="panel-toolbar">
      <h3>Tool Registry</h3>
    </div>
    <div id="tools-content"><div class="empty-state"><div class="empty-icon">◌</div><p>Connect to load tools</p></div></div>
  </div>
</div>

<div id="graph-tooltip"></div>

<script>
let API = '';
let TOKEN = '';
let factsData = [];
let projectsData = [];
let toolsData = [];

// ── CONNECT ──
async function connect() {
  API = document.getElementById('api-url').value.trim().replace(/\/$/, '');
  TOKEN = document.getElementById('api-token').value.trim();
  const dot = document.getElementById('status-dot');
  dot.className = '';

  try {
    const r = await apiFetch('/api/health');
    if (r.status === 'ok') {
      dot.className = 'online';
      await loadAll();
    }
  } catch (e) {
    dot.className = 'error';
  }
}

async function apiFetch(path, options = {}) {
  const res = await fetch(API + path, {
    ...options,
    headers: {
      'Authorization': `Bearer ${TOKEN}`,
      'Content-Type': 'application/json',
      ...(options.headers || {})
    }
  });
  return res.json();
}

async function loadAll() {
  await Promise.all([loadMemory(), loadCheckpoint(), loadProjects(), loadTools()]);
}

// ── MEMORY ──
async function loadMemory() {
  document.getElementById('memory-content').innerHTML = '<div class="loading"><div class="spinner"></div>Loading facts…</div>';
  try {
    const data = await apiFetch('/api/memory/core');
    factsData = data.facts || [];
    document.getElementById('count-memory').textContent = factsData.length;
    renderMemory(factsData);
    renderGraph(factsData);
  } catch (e) {
    document.getElementById('memory-content').innerHTML = '<div class="empty-state"><p>Failed to load</p></div>';
  }
}

function renderMemory(facts) {
  if (!facts.length) {
    document.getElementById('memory-content').innerHTML = '<div class="empty-state"><div class="empty-icon">◌</div><p>No core facts yet</p></div>';
    return;
  }
  document.getElementById('memory-content').innerHTML = `
    <div class="cards-grid">
      ${facts.map(f => `
        <div class="card">
          <div class="card-label">${f.category}</div>
          <div class="card-content">${f.content}</div>
          <div class="card-meta">
            <span class="tag cat-${f.category}">${f.category}</span>
            <span class="tag importance-${f.importance}">i:${f.importance}</span>
            <span class="card-time">${timeAgo(f.created_at)}</span>
          </div>
        </div>
      `).join('')}
    </div>`;
}

// ── CHECKPOINT ──
async function loadCheckpoint() {
  document.getElementById('checkpoint-content').innerHTML = '<div class="loading"><div class="spinner"></div>Loading checkpoint…</div>';
  try {
    const data = await apiFetch('/api/memory/checkpoint/latest');
    const cp = data.checkpoint;
    if (!cp) {
      document.getElementById('checkpoint-content').innerHTML = '<div class="empty-state"><div class="empty-icon">◌</div><p>No checkpoints yet</p></div>';
      document.getElementById('count-checkpoint').textContent = '—';
      return;
    }
    document.getElementById('count-checkpoint').textContent = '1';
    document.getElementById('checkpoint-content').innerHTML = `
      <div class="checkpoint-card">
        <h4>Last Session</h4>
        <div class="checkpoint-summary">${cp.summary || '—'}</div>
        <div class="checkpoint-grid">
          <div class="checkpoint-col">
            <h5>Active Topics</h5>
            <ul>${(cp.active_topics || []).map(t => `<li>${t}</li>`).join('')}</ul>
          </div>
          <div class="checkpoint-col">
            <h5>Decisions Made</h5>
            <ul>${(cp.decisions_made || []).map(d => `<li>${d}</li>`).join('')}</ul>
          </div>
          <div class="checkpoint-col">
            <h5>Open Threads</h5>
            <ul>${(cp.open_threads || []).map(o => `<li>${o}</li>`).join('')}</ul>
          </div>
        </div>
        ${cp.next_logical_step ? `<div class="next-step">${cp.next_logical_step}</div>` : ''}
      </div>`;
  } catch (e) {
    document.getElementById('checkpoint-content').innerHTML = '<div class="empty-state"><p>Failed to load</p></div>';
  }
}

// ── PROJECTS ──
async function loadProjects() {
  document.getElementById('projects-content').innerHTML = '<div class="loading"><div class="spinner"></div>Loading projects…</div>';
  try {
    const data = await apiFetch('/api/projects');
    projectsData = data.projects || [];
    document.getElementById('count-projects').textContent = projectsData.length;
    renderProjects();
  } catch (e) {
    document.getElementById('projects-content').innerHTML = '<div class="empty-state"><p>Failed to load</p></div>';
  }
}

function renderProjects() {
  if (!projectsData.length) {
    document.getElementById('projects-content').innerHTML = '<div class="empty-state"><div class="empty-icon">◌</div><p>No projects yet</p></div>';
    return;
  }
  document.getElementById('projects-content').innerHTML = `
    <div class="cards-grid">
      ${projectsData.map(p => `
        <div class="card project-card" onclick="loadProjectFiles('${p.id}', this)">
          <div class="card-label">project · ${p.status}</div>
          <div class="project-name">${p.name}</div>
          <div class="project-desc">${p.description || 'No description'}</div>
          <div class="tech-tags">
            ${(p.tech_stack || []).map(t => `<span class="tag">${t}</span>`).join('')}
          </div>
          <div class="card-meta" style="margin-top:10px">
            <span class="card-time">${timeAgo(p.last_modified)}</span>
          </div>
          <div class="file-tree-container" style="margin-top:14px;display:none"></div>
        </div>
      `).join('')}
    </div>`;
}

async function loadProjectFiles(id, card) {
  const container = card.querySelector('.file-tree-container');
  if (container.style.display === 'block') {
    container.style.display = 'none';
    return;
  }
  container.style.display = 'block';
  container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    const data = await apiFetch(`/api/projects/${id}/tree`);
    const files = data.files || [];
    if (!files.length) {
      container.innerHTML = '<div style="font-size:11px;color:var(--text-light);font-family:DM Mono,monospace;padding:8px 0">No files yet</div>';
      return;
    }
    container.innerHTML = `
      <div class="file-tree">
        <div class="file-tree-header">files (${files.length})</div>
        ${files.map(f => `
          <div class="file-row">
            <span class="file-icon">◦</span>
            <span class="file-path">${f.path}</span>
            <span class="file-ver">v${f.current_version}</span>
          </div>
        `).join('')}
      </div>`;
  } catch (e) {
    container.innerHTML = '<div style="font-size:11px;color:var(--accent-warm)">Failed to load files</div>';
  }
}

// ── TOOLS ──
async function loadTools() {
  document.getElementById('tools-content').innerHTML = '<div class="loading"><div class="spinner"></div>Loading tools…</div>';
  try {
    const data = await apiFetch('/api/tools');
    toolsData = data.tools || [];
    document.getElementById('count-tools').textContent = toolsData.length;
    renderTools();
  } catch (e) {
    document.getElementById('tools-content').innerHTML = '<div class="empty-state"><p>Failed to load</p></div>';
  }
}

function renderTools() {
  if (!toolsData.length) {
    document.getElementById('tools-content').innerHTML = '<div class="empty-state"><div class="empty-icon">◌</div><p>No tools yet</p></div>';
    return;
  }
  document.getElementById('tools-content').innerHTML = `
    <div class="cards-grid">
      ${toolsData.map(t => `
        <div class="card tool-card">
          <div class="card-label">tool · ${t.agent}</div>
          <div class="tool-name">${t.name}</div>
          <div class="tool-desc">${t.description}</div>
          ${t.trigger_hint ? `<div class="tool-trigger">${t.trigger_hint}</div>` : ''}
          <div class="card-meta">
            <span class="tag">${t.created_by}</span>
            <span class="card-time">${timeAgo(t.created_at)}</span>
          </div>
        </div>
      `).join('')}
    </div>`;
}

// ── KNOWLEDGE GRAPH ──
function renderGraph(facts) {
  const svg = d3.select('#graph-canvas');
  svg.selectAll('*').remove();

  if (!facts.length) {
    document.getElementById('graph-meta').textContent = '— no facts loaded';
    return;
  }

  document.getElementById('graph-meta').textContent = `${facts.length} facts · ${[...new Set(facts.map(f => f.category))].length} categories`;

  const W = document.getElementById('graph-section').clientWidth;
  const H = 260;
  svg.attr('width', W).attr('height', H);

  // Nodes: center node + fact nodes
  const centerNode = { id: 'center', label: 'You', type: 'center', fx: W / 2, fy: H / 2 };
  const factNodes = facts.map(f => ({
    id: f.id,
    label: f.content.slice(0, 32) + (f.content.length > 32 ? '…' : ''),
    fullLabel: f.content,
    type: 'fact',
    category: f.category,
    importance: f.importance
  }));
  const nodes = [centerNode, ...factNodes];
  const links = factNodes.map(f => ({ source: 'center', target: f.id }));

  const colorMap = {
    goal: '#2dc47a',
    preference: '#2d5ec4',
    pattern: '#7c2dc4',
    decision: '#c4622d',
    context: '#8a8680',
    relationship: '#c42d2d'
  };

  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(90))
    .force('charge', d3.forceManyBody().strength(-120))
    .force('center', d3.forceCenter(W / 2, H / 2))
    .force('collision', d3.forceCollide(28));

  const link = svg.append('g')
    .selectAll('line')
    .data(links)
    .join('line')
    .attr('stroke', '#e8e4de')
    .attr('stroke-width', 1.5);

  const node = svg.append('g')
    .selectAll('g')
    .data(nodes)
    .join('g')
    .style('cursor', 'pointer');

  node.append('circle')
    .attr('r', d => d.type === 'center' ? 18 : 8 + (d.importance || 1) * 2)
    .attr('fill', d => d.type === 'center' ? '#1a1814' : (colorMap[d.category] || '#8a8680'))
    .attr('fill-opacity', d => d.type === 'center' ? 1 : 0.15)
    .attr('stroke', d => d.type === 'center' ? '#1a1814' : (colorMap[d.category] || '#8a8680'))
    .attr('stroke-width', d => d.type === 'center' ? 0 : 1.5);

  node.filter(d => d.type === 'center').append('text')
    .attr('text-anchor', 'middle')
    .attr('dy', '0.35em')
    .attr('fill', '#f9f8f6')
    .attr('font-family', 'DM Serif Display, serif')
    .attr('font-size', '11px')
    .text('You');

  const tooltip = document.getElementById('graph-tooltip');

  node.on('mouseover', function(event, d) {
    if (d.type === 'fact') {
      tooltip.textContent = d.fullLabel;
      tooltip.style.opacity = 1;
    }
  })
  .on('mousemove', function(event) {
    tooltip.style.left = (event.clientX + 12) + 'px';
    tooltip.style.top = (event.clientY - 8) + 'px';
  })
  .on('mouseout', function() {
    tooltip.style.opacity = 0;
  });

  sim.on('tick', () => {
    link
      .attr('x1', d => d.source.x)
      .attr('y1', d => d.source.y)
      .attr('x2', d => d.target.x)
      .attr('y2', d => d.target.y);

    node.attr('transform', d => {
      const x = Math.max(20, Math.min(W - 20, d.x));
      const y = Math.max(20, Math.min(H - 20, d.y));
      return `translate(${x},${y})`;
    });
  });
}

// ── TABS ──
function switchTab(name) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  event.currentTarget.classList.add('active');
}

// ── UTILS ──
function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  return `${Math.floor(h / 24)}d ago`;
}

// Auto-connect if values pre-filled
window.addEventListener('load', () => {
  if (document.getElementById('api-token').value) connect();
});
